plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'fabric-loom' version '1.2.5'
    id 'java'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
def mcVersion = "1.21.1"
def placeboVersion = "9.9.1"
def attributesLibVersion = "2.9.0"

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
    maven { url = "https://jitpack.io" }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }

        filter {
            includeGroup "maven.modrinth"
        }
    }

	// Fabric
	maven { url = "https://maven.fabricmc.net/" }

	// Ladysnake (Origins, Apoli, Calio)
	maven { url = "https://maven.ladysnake.org/releases" }
	// Cloth Config
	maven { url = "https://maven.shedaniel.me/" }

	// Mod Menu
	maven { url = "https://maven.terraformersmc.com/releases/" }

	// Modrinth Maven (Additional Entity Attributes)
	maven { url = "https://api.modrinth.com/maven" }

	// Quilt (JSON parsers)
	maven { url = "https://maven.quiltmc.org/repository/release/" }


}

loom {
	splitEnvironmentSourceSets()

	mods {
		"origins-diversity" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Apoli (Fabric)
	modImplementation "io.github.apace100:apoli:2.12.0-pre.1+mc.1.21.1"

	// Origins (Fabric)
	modImplementation("io.github.apace100:origins-fabric:1.13.0-pre.1+mc.1.21.1") {
		exclude group: "carpet", module: "fabric-carpet"
	}

    modCompileOnly "maven.modrinth:FCFcFw09:8lqoMfo7"
    modRuntimeOnly "maven.modrinth:FCFcFw09:8lqoMfo7"
    modCompileOnly "maven.modrinth:Adega8YN:d1TKoLnB"
    modRuntimeOnly "maven.modrinth:Adega8YN:d1TKoLnB"
    modCompileOnly "maven.modrinth:twkfQtEc:XAvedFDj"
    modRuntimeOnly "maven.modrinth:twkfQtEc:XAvedFDj"
    modApi("com.github.Virtuoel:Pehkui:${pehkui_version}", {
        exclude group: "net.fabricmc.fabric-api"
    })

}


processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}